name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # El núcleo del pipeline no depende de LightGBM ni de PyTorch: la
      # integración continua se mantiene ligera y se ejecuta en menos de un minuto.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pytest pytest-cov ruff

      - name: Análisis estático
        run: ruff check src tests scripts

      - name: Pruebas y cobertura
        run: pytest --cov=src/fraude --cov-report=term-missing --cov-fail-under=85
